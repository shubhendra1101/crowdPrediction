# Zones (T2.4): floor polygons in metres, in the room frame of configs/cameras/<room>.yaml (floor Z = 0).
# Seating blocks follow the desk columns/rows found by the calibration; boundaries are approximate.
room: H706
cameras: [cam03]
frame: X along the desk rows, Y from the camera (back wall) towards the board; origin = near-left corner of a centre desk
head_height_m: 1.2
zones:
  back_left:
  - [-5.3, -3.2]
  - [-2.1, -3.2]
  - [-2.1, 0.0]
  - [-5.3, 0.0]
  back_centre:
  - [-2.1, -3.2]
  - [1.2, -3.2]
  - [1.2, 0.0]
  - [-2.1, 0.0]
  back_right:
  - [1.2, -3.2]
  - [2.9, -3.2]
  - [2.9, 0.0]
  - [1.2, 0.0]
  middle_left:
  - [-5.3, 0.0]
  - [-2.1, 0.0]
  - [-2.1, 2.6]
  - [-5.3, 2.6]
  middle_centre:
  - [-2.1, 0.0]
  - [1.2, 0.0]
  - [1.2, 2.6]
  - [-2.1, 2.6]
  middle_right:
  - [1.2, 0.0]
  - [2.9, 0.0]
  - [2.9, 2.6]
  - [1.2, 2.6]
  front_left:
  - [-5.3, 2.6]
  - [-2.1, 2.6]

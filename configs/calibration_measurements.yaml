# Floor measurements for camera calibration (T2.1), supplied by the user 2026-10-21 with photos in
# data/cctv/calibration/ (original notes: data/cctv/calibration/measurments.txt). Values in metres.
# Desks in H705/H706 are desk+bench units in 5 columns (front -> back); "gap" = empty floor between units.
H705:
  desk_length_m: 1.04          # long side, across the room
  desk_depth_m: 0.91
  column_gaps_m: [0.79, 0.82, 0.87, 0.78]   # between columns 1-2, 2-3, 3-4, 4-5 (left -> right)
  row_spacing_m: 1.04          # "gap b/w rows" — OPEN QUESTION: front-leg-to-front-leg pitch, or empty gap?
  rows_per_column: 11          # user filled empty front/back space with imaginary benches
  door_m: {width: 1.20, height: 2.23}
  podium_m: {width: 0.61, height: 1.23}
  camera_height_note: "user: nearly the door height (~2.2 m); earlier given as 6 ft 6 in (1.98 m)"
  consistency_check: >
    5 x 1.04 + (0.79+0.82+0.87+0.78) = 8.46 m across, but room width was given as 8.03 m (26 ft 4 in);
    11 rows x 1.04 = 11.44 m front-back vs room length 10.36 m (34 ft). Not yet resolved — calibration will
    use local desk distances, and the door width is the independent check.
H706:
  desk_length_m: 1.04
  desk_depth_m: 0.91
  column_gaps_m: [0.89, 0.89, 0.91, 0.88]
  row_spacing_m: 0.96          # user: 95–97 cm
  rows_per_column: 11
  door_m: {width: 1.12, height: 2.13}
  podium_m: {width: 0.61, height: 1.23}

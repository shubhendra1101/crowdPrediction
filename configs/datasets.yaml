# Dataset registry (T1.1). Read by scripts/download_data.py.
# Sources verified 2026-09-30. Kaggle entries are community mirrors of the official datasets:
# their file counts are checked against the official split sizes (`expect`) after download.
# Roles let a machine skip what it doesn't need (e.g. the laptop fetches only trajectories + metadata).

max_single_download_gb: 5          # CLAUDE.md §6: ask before anything larger

datasets:
  # ---------------- Jülich Pedestrian Dynamics Data Archive (must) ----------------
  # https://ped.fz-juelich.de/da/ — no registration; cite the DOI of each experiment.
  julich_bottleneck1:
    group: must
    source: julich
    doi: 10.34735/ped.2005.2
    note: "Rotunde bottleneck 2005, 25 fps; archive page: ID, time, x [m], y [m]"
    license: "Free for research with attribution (archive terms)"
    files:
      - {role: metadata, url: "http://ped.fz-juelich.de/experiments/2005.12.07_Juelich_Rotunde_Bottleneck/data/2005bottleneck1_metadata.json"}
      - {role: trajectories, size_mb: 0.1, url: "http://ped.fz-juelich.de/experiments/2005.12.07_Juelich_Rotunde_Bottleneck/data/trajectories_txt.zip"}
      - {role: video, size_mb: 618, url: "http://ped.fz-juelich.de/experiments/2005.12.07_Juelich_Rotunde_Bottleneck/data/topview_video_start.zip"}
      - {role: video, size_mb: 49.5, url: "http://ped.fz-juelich.de/experiments/2005.12.07_Juelich_Rotunde_Bottleneck/data/topview_video.zip"}


  # ---------------- Crowd-counting image benchmarks ----------------
  shanghaitech:
    group: must
    source: kaggle
    kaggle: tthien/shanghaitech
    size_mb: 349
    note: "Mirror of ShanghaiTech A/B (Zhang et al., CVPR 2016). Official split sizes checked below."
    license: "Research use (original dataset terms); Kaggle page: Unknown"
    files:
      - {role: images}
    expect:
      "**/part_A*/train_data/images/*.jpg": 300
      "**/part_A*/test_data/images/*.jpg": 182
      "**/part_B*/train_data/images/*.jpg": 400
      "**/part_B*/test_data/images/*.jpg": 316

  jhu_crowd_v2:
    group: should
    source: kaggle
    kaggle: hibafathi/jhu-crowd-v2-0
    size_mb: 3084
    note: "Mirror of JHU-Crowd++ v2.0 (Sindagi et al., TPAMI 2020); official site needs a request. Split sizes checked below."
    license: "CC BY-NC-SA 4.0 per Kaggle page"
    files:
      - {role: images}
    expect:
      "**/train/images/*.jpg": 2272
      "**/val/images/*.jpg": 500
      "**/test/images/*.jpg": 1600

  # ---------------- Video sequences ----------------
  mall:
    group: should
    source: http
    note: "CUHK Mall dataset (Chen et al., BMVC 2012): 2000 frames 640x480, < 2 Hz, head points. Research use only."
    license: "Research only, non-commercial, cite"
    files:
      - {role: images, url: "https://personal.ie.cuhk.edu.hk/~ccloy/files/datasets/mall_dataset.zip"}
    expect:
      "**/frames/*.jpg": 2000

  ucsd_pedestrian:
    group: should
    source: kaggle
    kaggle: aryashah2k/ucsd-pedestrian-database
    size_mb: 792
    note: "Mirror of UCSD pedestrian counting (Chan et al., CVPR 2008); official svcl.ucsd.edu site did not respond 2026-09-30. Contents inventoried, not asserted."
    license: "CC0 per Kaggle page; cite original"
    files:
      - {role: images}

  # ---------------- Nice to have — manual, not fetched automatically ----------------
  # FDST (Fang et al., ICME 2019): Google Drive link on its GitHub page — add later if needed.
  # NWPU-Crowd: requires registration on its website — only if we decide to benchmark on it.

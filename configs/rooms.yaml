# Room and camera measurements supplied by the user (2026-10-15), originally in feet.
# Converted with 1 ft = 0.3048 m, 1 in = 0.0254 m. These are room dimensions, not floor-point
# measurements: any calibration derived from them is labelled "approximate (room dimensions)".
rooms:
  H705:
    use: classroom (cam01, cam02)
    length_m: 10.363      # 34 ft
    width_m: 8.026        # 26 ft 4 in
    height_m: 2.743       # 9 ft
    source: "user, measured; earlier figures were rough"
  H706:
    use: classroom (cam03) — same dimensions as H705 per user; camera on the opposite side
    length_m: 10.363      # 34 ft
    width_m: 8.026        # 26 ft 4 in
    height_m: 2.743       # 9 ft
    source: "user: same as H705"
  H103:
    use: computer lab (cam04)
    length_m: 13.106      # 43 ft
    width_m: 9.144        # 30 ft
    height_m: 2.743       # 9 ft
    source: "user, measured"

cameras:
  cam01: {room: H705, mount: top corner, height_m: 1.981, height_note: "6 ft 6 in", content: "lecture (72 min)"}
  cam02: {room: H705, mount: top corner, height_m: 1.981, height_note: "6 ft 6 in", content: "lecture -> mass exit -> empty (15 min)"}
  cam03: {room: H706, mount: "top corner, opposite side to the H705 view", height_m: 1.981, height_note: "6 ft 6 in (same as H705)",
          content: "students studying, then leaving at break"}
  cam04: {room: H103, mount: top corner, height_m: 2.134, height_note: "about 7 ft — approximate", content: "empty lab, then students entering"}

# Room and camera measurements supplied by the user (2026-10-15), originally in feet.
# Converted with 1 ft = 0.3048 m, 1 in = 0.0254 m. These are room dimensions, not floor-point
# measurements: any calibration derived from them is labelled "approximate (room dimensions)".
rooms:
  H705:
    use: classroom (cam01, cam02)
    length_m: 10.363      # 34 ft
    width_m: 8.026        # 26 ft 4 in
    height_m: 2.743       # 9 ft
    source: "user, measured; earlier figures were rough"
  H706:
    use: classroom (cam03) — same dimensions as H705 per user; camera on the opposite side
    length_m: 10.363      # 34 ft
    width_m: 8.026        # 26 ft 4 in
    height_m: 2.743       # 9 ft
    source: "user: same as H705"
  H103:
    use: computer lab (cam04)
    length_m: 13.106      # 43 ft
    width_m: 9.144        # 30 ft
    height_m: 2.743       # 9 ft
    source: "user, measured"

# Camera heights: user values (2026-10-22: "about door height", replacing the earlier 6 ft 6 in / 7 ft) and what the
# calibration (results/calibration.md) finds. Calibrated camera models: configs/cameras/<room>.yaml.
cameras:
  cam01: {room: H705, mount: "front wall, corner", height_m: 2.23, calibrated_height_m: 2.23,
          height_note: "user ~door height; used to place the floor", content: "lecture (72 min)"}
  cam02: {room: H705, mount: "same camera as cam01", height_m: 2.23, calibrated_height_m: 2.23,
          height_note: "user ~door height", content: "lecture -> mass exit -> empty (15 min)"}
  cam03: {room: H706, mount: "back wall, corner, near the ceiling", height_m: 2.13, calibrated_height_m: 2.57,
          height_note: "user said ~door height (2.13 m); calibration 2.57 m (desk model) and 2.71-2.73 m (doors)",
          content: "students studying, then leaving at break"}
  cam04: {room: H103, mount: "front, corner", height_m: 2.58, calibrated_height_m: 2.51,
          height_note: "user ~door height; calibration 2.51 m (-3 %) without using it", content: "empty lab, then students entering"}
